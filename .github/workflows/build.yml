name: Compile mon APK Flutter

on:
  push:
    branches: [ main ] # Se déclenche à chaque fois que vous modifiez le code
  workflow_dispatch: # Permet de lancer la compilation manuellement d'un clic

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Java (Obligatoire pour Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurer Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'

    - name: Réparer et créer l'environnement Android automatiquement
      run: flutter create . --platforms=android

    - name: Récupérer les dépendances (pub get)
      run: flutter pub get

    - name: Compiler l'APK en mode Release
      run: flutter build apk --release

    - name: Sauvegarder l'APK pour le télécharger
      uses: actions/upload-artifact@v4
      with:
        name: MonApplicationFrigoRecettes
        path: build/app/outputs/flutter-apk/app-release.apk
