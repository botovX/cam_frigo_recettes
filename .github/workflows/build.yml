name: Compile mon APK Flutter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurer Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable' # On repasse sur la dernière version stable

    - name: Créer un projet Android propre et compatible
      run: |
        flutter create . --platforms=android --org com.frigorecettes
        
    - name: Forcer la compatibilité Gradle pour AdMob
      run: |
        echo "android.useAndroidX=true" > android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties

    - name: Récupérer les dépendances
      run: flutter pub get

    - name: Compiler l'APK en mode Release
      run: flutter build apk --release --no-pub
      
    - name: Sauvegarder l'APK pour le télécharger
      uses: actions/upload-artifact@v4
      with:
        name: MonApplicationFrigoRecettes
        path: build/app/outputs/flutter-apk/app-release.apk
